name: Deploy to Azure
on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_HT_ECOM }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_HT_ECOM }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_HT_ECOM }}

      - name: login in to Azure registry
        run: az acr login --name htecomregistry

      - name: Deploy to Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: htecomregistry.azurecr.io
          containerAppName: ht-ecom-backend
          resourceGroup: Ht_ecom
          imageToBuild: htecomregistry.azurecr.io/ht-ecom-backend:${{ github.sha }}

